<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEVO Intercom Real-Time Training App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-[#f4f5f7] text-[#1a1a1a] h-screen overflow-hidden antialiased">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // YOUR SUPABASE CREDENTIALS
    const SUPABASE_URL = "https://ngqcidwtbnotylrrnqwm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_u7jNjlO1c7Z3AFvXzhwLMQ_LvLKjGip";

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function IntercomApp() {
      const [role, setRole] = useState("Agent"); // "Agent" (Trainee) or "Customer" (Trainer)
      const [activeTab, setActiveTab] = useState("Reply");
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState("");
      const chatEndRef = useRef(null);

      // Fetch existing messages and subscribe to Realtime updates
      useEffect(() => {
        fetchMessages();

        const channel = supabase
          .channel('schema-db-changes')
          .on(
            'postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'messages' },
            (payload) => {
              setMessages((prev) => [...prev, payload.new]);
            }
          )
          .subscribe();

        return () => {
          supabase.removeChannel(channel);
        };
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const fetchMessages = async () => {
        const { data, error } = await supabase
          .from('messages')
          .select('*')
          .order('created_at', { ascending: true });
        if (!error && data) setMessages(data);
      };

      const sendMessage = async () => {
        if (!inputText.trim()) return;

        const newMessage = {
          text: inputText,
          sender: role === "Customer" ? "Tremaine Malden" : "Agent",
          role: role === "Customer" ? "user" : "assistant",
          is_note: role === "Agent" && activeTab === "Note"
        };

        setInputText("");
        await supabase.from('messages').insert([newMessage]);
      };

      return (
        <div className="flex flex-col h-screen w-full bg-white text-xs select-none">
          
          {/* TOP ROLE SWITCHER BAR */}
          <div className="bg-slate-900 text-white px-4 py-2 flex justify-between items-center text-xs shrink-0">
            <div className="flex items-center gap-2">
              <span className="font-bold text-amber-400">⚡ LIVE TRAINING MODE</span>
              <span className="text-gray-400">| Switch viewing role:</span>
            </div>
            <div className="flex gap-2">
              <button 
                onClick={() => setRole("Agent")} 
                className={`px-3 py-1 rounded font-bold transition ${role === "Agent" ? "bg-blue-600 text-white" : "bg-gray-800 text-gray-300 hover:bg-gray-700"}`}>
                🎧 View as Trainee (Agent UI)
              </button>
              <button 
                onClick={() => setRole("Customer")} 
                className={`px-3 py-1 rounded font-bold transition ${role === "Customer" ? "bg-emerald-600 text-white" : "bg-gray-800 text-gray-300 hover:bg-gray-700"}`}>
                👤 View as Trainer (Customer)
              </button>
            </div>
          </div>

          <div className="flex flex-1 overflow-hidden">
            {/* 1. FAR LEFT ICON SIDEBAR */}
            <div className="w-[52px] bg-[#1d1d21] text-gray-400 flex flex-col items-center py-3 justify-between border-r border-gray-800 shrink-0">
              <div className="flex flex-col items-center gap-5">
                <div className="w-8 h-8 bg-black rounded-lg flex items-center justify-center font-bold text-white text-sm shadow">i</div>
                <button className="p-2 text-white bg-gray-800 rounded-lg hover:bg-gray-700"><i data-lucide="inbox" className="w-4 h-4"></i></button>
                <button className="p-2 hover:text-white"><i data-lucide="message-square" className="w-4 h-4"></i></button>
                <button className="p-2 hover:text-white"><i data-lucide="users" className="w-4 h-4"></i></button>
              </div>
              <div className="flex flex-col items-center gap-4">
                <button className="p-2 hover:text-white"><i data-lucide="settings" className="w-4 h-4"></i></button>
                <div className="w-7 h-7 rounded-full bg-emerald-600 text-white font-semibold flex items-center justify-center text-[10px]">W</div>
              </div>
            </div>

            {/* 2. INBOX NAVIGATION PANEL */}
            <div className="w-56 bg-[#f9fafb] border-r border-gray-200 flex flex-col shrink-0">
              <div className="p-3 border-b border-gray-200 flex justify-between items-center bg-white">
                <span className="font-bold text-sm text-gray-900">Inbox</span>
              </div>
              <div className="p-2 border-b border-gray-200">
                <div className="flex items-center gap-2 bg-gray-100 px-2 py-1.5 rounded-md border border-gray-200">
                  <i data-lucide="search" className="w-3.5 h-3.5 text-gray-400"></i>
                  <input type="text" placeholder="Search" className="bg-transparent text-xs outline-none w-full text-gray-700" />
                </div>
              </div>
              <div className="flex-1 overflow-y-auto p-2 space-y-1">
                <div className="flex items-center justify-between px-2 py-1.5 rounded bg-gray-200 font-semibold text-gray-900 cursor-pointer">
                  <div className="flex items-center gap-2"><i data-lucide="users" className="w-3.5 h-3.5"></i><span>All</span></div>
                  <span className="bg-gray-300 px-1.5 py-0.5 rounded-full text-[10px]">1</span>
                </div>
              </div>
            </div>

            {/* 3. CONVERSATION QUEUE LIST */}
            <div className="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0">
              <div className="p-3 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <span className="font-bold text-gray-900 text-sm">All</span>
                <span className="text-[10px] text-gray-400">1 Open</span>
              </div>
              <div className="p-3 bg-blue-50/60 border-l-4 border-blue-600 cursor-pointer">
                <div className="flex justify-between items-center mb-1">
                  <div className="flex items-center gap-1.5 font-semibold text-gray-900">
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span>Tremaine Malden</span>
                  </div>
                  <span className="text-[10px] text-gray-400">Live</span>
                </div>
                <p className="text-gray-600 text-[11px] line-clamp-1">
                  {messages.length > 0 ? messages[messages.length - 1].text : "No messages yet"}
                </p>
              </div>
            </div>

            {/* 4. MAIN CHAT & COMPOSER AREA */}
            <div className="flex-1 bg-white flex flex-col min-w-0">
              <div className="h-12 px-4 border-b border-gray-200 flex justify-between items-center bg-white shrink-0">
                <h2 className="font-bold text-sm text-gray-900">Tremaine Malden</h2>
                <div className="text-[11px] text-gray-500">Current View: <b className="text-blue-600">{role} Mode</b></div>
              </div>

              {/* Chat Thread */}
              <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-[#fafafa]">
                {messages.length === 0 && (
                  <div className="text-center text-gray-400 py-10">No messages yet. Send a message to start the real-time simulation!</div>
                )}
                {messages.map((m, idx) => (
                  <div key={idx} className="space-y-1">
                    {m.is_note ? (
                      <div className="bg-amber-100 border border-amber-300 p-2.5 rounded-lg text-amber-900 text-xs max-w-[85%] mx-auto">
                        <div className="font-bold text-[10px] text-amber-700">🔒 INTERNAL NOTE</div>
                        <div>{m.text}</div>
                      </div>
                    ) : m.role === "assistant" ? (
                      <div className="max-w-[80%] bg-[#2563eb] text-white p-3 rounded-2xl rounded-tr-none ml-auto shadow-sm">
                        <div className="text-[9px] text-blue-200 font-semibold mb-0.5">Agent</div>
                        <div>{m.text}</div>
                      </div>
                    ) : (
                      <div className="flex gap-2 max-w-[85%] items-start">
                        <div className="w-6 h-6 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-[10px] shrink-0 mt-1">T</div>
                        <div className="bg-white border border-gray-200 p-3 rounded-2xl rounded-tl-none text-gray-800 shadow-sm">
                          <div className="text-[9px] text-gray-400 font-semibold mb-0.5">Tremaine (Customer)</div>
                          <div>{m.text}</div>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
                <div ref={chatEndRef} />
              </div>

              {/* Composer */}
              <div className="p-3 border-t border-gray-200 bg-white shrink-0">
                <div className="border border-gray-300 rounded-lg p-2 bg-white shadow-sm">
                  {role === "Agent" && (
                    <div className="flex items-center gap-3 border-b border-gray-100 pb-1.5 mb-2">
                      <button onClick={() => setActiveTab("Reply")} className={`font-semibold ${activeTab === "Reply" ? "text-blue-600" : "text-gray-400"}`}>
                        Reply
                      </button>
                      <button onClick={() => setActiveTab("Note")} className={`font-semibold ${activeTab === "Note" ? "text-amber-600" : "text-gray-400"}`}>
                        Internal Note
                      </button>
                    </div>
                  )}
                  <textarea 
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    onKeyDown={(e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
                    placeholder={role === "Customer" ? "Type as Customer (Trainer)..." : (activeTab === "Note" ? "Write private internal note..." : "Reply as Agent (Trainee)...")}
                    className="w-full text-xs outline-none resize-none min-h-[60px]"
                  />
                  <div className="flex justify-end pt-1 border-t border-gray-100">
                    <button onClick={sendMessage} className="bg-blue-600 text-white px-4 py-1.5 rounded font-medium hover:bg-blue-700">
                      Send {role === "Customer" ? "(Customer)" : (activeTab === "Note" ? "(Note)" : "(Reply)")}
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {/* 5. RIGHT METADATA PANEL */}
            <div className="w-64 bg-[#fcfcfd] border-l border-gray-200 p-3 shrink-0 overflow-y-auto">
              <div className="font-bold text-gray-800 mb-3">User Data</div>
              <div className="space-y-2 text-gray-600 text-xs">
                <div><span className="text-gray-400">Name:</span> Tremaine Malden</div>
                <div><span className="text-gray-400">Company:</span> ZEVO</div>
                <div><span className="text-gray-400">Status:</span> Active Rental</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<IntercomApp />);
  </script>
</body>
</html>
