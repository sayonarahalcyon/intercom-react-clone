<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEVO Intercom Real-Time Training App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-[#f4f5f7] text-[#1a1a1a] h-screen overflow-hidden antialiased">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // YOUR SUPABASE CREDENTIALS
    const SUPABASE_URL = "https://ngqcidwtbnotylrrnqwm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_u7jNjlO1c7Z3AFvXzhwLMQ_LvLKjGip";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function IntercomApp() {
      const [role, setRole] = useState("Agent");
      const [customerName, setCustomerName] = useState("Tremaine Malden");
      const [agentName, setAgentName] = useState("Agent");

      const [activeChatId, setActiveChatId] = useState("chat_default");
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState("");
      const [activeTab, setActiveTab] = useState("Reply");
      const [contactNotes, setContactNotes] = useState([]);
      const [noteInput, setNoteInput] = useState("");
      const [ticketScripts, setTicketScripts] = useState([]);
      const [botScenarios, setBotScenarios] = useState([]);
      const [creatingAIScenario, setCreatingAIScenario] = useState(false);
      const chatEndRef = useRef(null);

      // Fetch initial data & subscribe globally
      useEffect(() => {
        fetchAllMessages();
        fetchAllContactNotes();
        fetchAllTicketScripts();
        fetchAllBotScenarios();

        const channel = supabase
          .channel('global-realtime-channel')
          .on(
            'postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'messages' },
            (payload) => {
              const newMsg = payload.new;
              setMessages((prev) => prev.some(m => m.id === newMsg.id) ? prev : [...prev, newMsg]);
            }
          )
          .on(
            'postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'contact_notes' },
            (payload) => {
              const newNote = payload.new;
              setContactNotes((prev) => prev.some(n => n.id === newNote.id) ? prev : [...prev, newNote]);
            }
          )
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'ticket_scripts' },
            (payload) => {
              if (payload.eventType === 'INSERT') {
                setTicketScripts((prev) => prev.some(s => s.id === payload.new.id) ? prev : [...prev, payload.new]);
              } else if (payload.eventType === 'UPDATE') {
                setTicketScripts((prev) => prev.map(s => s.id === payload.new.id ? payload.new : s));
              }
            }
          )
          .on(
            'postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'bot_scenarios' },
            (payload) => {
              const newScenario = payload.new;
              setBotScenarios((prev) => prev.some(s => s.conversation_id === newScenario.conversation_id) ? prev : [...prev, newScenario]);
            }
          )
          .subscribe();

        // Safety net: even if the realtime push ever drops (flaky connection, a table not
        // fully enabled for realtime, etc.), re-pull everything every few seconds so nothing
        // ever requires a manual page refresh to show up.
        const pollId = setInterval(() => {
          fetchAllMessages();
          fetchAllContactNotes();
          fetchAllTicketScripts();
          fetchAllBotScenarios();
        }, 4000);

        return () => {
          clearInterval(pollId);
          supabase.removeChannel(channel);
        };
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, activeChatId, role, activeTab]);

      const fetchAllMessages = async () => {
        const { data, error } = await supabase
          .from('messages')
          .select('*')
          .order('created_at', { ascending: true });
        if (!error && data) setMessages(data);
      };

      const fetchAllContactNotes = async () => {
        const { data, error } = await supabase
          .from('contact_notes')
          .select('*')
          .order('created_at', { ascending: true });
        if (!error && data) setContactNotes(data);
        // If the contact_notes table doesn't exist yet, this silently no-ops;
        // the Notes panel will just show its empty state until the table is created.
      };

      const fetchAllTicketScripts = async () => {
        const { data, error } = await supabase
          .from('ticket_scripts')
          .select('*')
          .order('sequence', { ascending: true });
        if (!error && data) setTicketScripts(data);
        // If the ticket_scripts table doesn't exist yet, this silently no-ops;
        // scripted tickets just behave like any regular manually-created chat.
      };

      const fetchAllBotScenarios = async () => {
        const { data, error } = await supabase
          .from('bot_scenarios')
          .select('conversation_id');
        if (!error && data) setBotScenarios(data);
        // If bot_scenarios doesn't exist yet (the AI backend hasn't been set up), this
        // silently no-ops — nothing is treated as AI-driven until it does.
      };

      const startAIScenario = async () => {
        setCreatingAIScenario(true);
        try {
          const res = await fetch('/api/customer-bot', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'start' })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Unknown error creating AI scenario.');
          await fetchAllMessages();
          await fetchAllBotScenarios();
          setActiveChatId(data.conversationId);
        } catch (err) {
          alert('Could not create an AI scenario.\n\n' + err.message + '\n\nHas the /api/customer-bot function been deployed, and are ANTHROPIC_API_KEY / INTERCOM_ACCESS_TOKEN set in Vercel?');
        } finally {
          setCreatingAIScenario(false);
        }
      };

      // Extract unique conversations dynamically from all database messages
      const getConversationList = () => {
        const map = new Map();

        // Default initial scenario
        map.set("chat_default", {
          id: "chat_default",
          customerName: "Tremaine Malden",
          lastMsg: "Initial practice chat",
          time: "Live"
        });

        messages.forEach(m => {
          const cid = m.conversation_id || "chat_default";
          const existing = map.get(cid) || {};
          map.set(cid, {
            id: cid,
            customerName: m.customer_name || existing.customerName || "Customer Scenario",
            lastMsg: m.text,
            time: m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "Live"
          });
        });

        return Array.from(map.values()).reverse();
      };

      const conversationList = getConversationList();
      const currentActiveChat = conversationList.find(c => c.id === activeChatId) || conversationList[0];
      const activeMessages = messages.filter(m => (m.conversation_id || "chat_default") === activeChatId);
      const customerNotes = contactNotes.filter(n => n.customer_name === (currentActiveChat?.customerName));

      const sendMessage = async () => {
        if (!inputText.trim()) return;

        const activeCustName = currentActiveChat ? currentActiveChat.customerName : customerName;
        const isAgentReply = role === "Agent" && activeTab !== "Note";

        const newMessage = {
          conversation_id: activeChatId,
          customer_name: activeCustName,
          text: inputText,
          sender: role === "Customer" ? activeCustName : agentName,
          role: role === "Customer" ? "user" : "assistant",
          is_note: role === "Agent" && activeTab === "Note"
        };

        setInputText("");
        await supabase.from('messages').insert([newMessage]);

        // If this conversation is a scripted real-ticket scenario, release the next
        // real customer message a couple seconds after the trainee replies. Instead of
        // always playing the exact same line, pick the branch that best matches the
        // *type* of reply the trainee gave (question / solution / default) — no AI call needed.
        if (isAgentReply) {
          const chatIdAtSend = activeChatId;
          const pendingForChat = ticketScripts.filter(s => s.conversation_id === chatIdAtSend && !s.delivered);

          if (pendingForChat.length > 0) {
            const nextStage = Math.min(...pendingForChat.map(s => s.sequence));
            const stageOptions = pendingForChat.filter(s => s.sequence === nextStage);
            const category = classifyReply(inputText);
            const chosen = stageOptions.find(s => s.category === category) || stageOptions.find(s => s.category === 'default') || stageOptions[0];

            setTimeout(async () => {
              await supabase.from('messages').insert([{
                conversation_id: chatIdAtSend,
                customer_name: chosen.customer_name,
                text: chosen.text,
                sender: chosen.customer_name,
                role: "user",
                is_note: false
              }]);
              // Mark every branch at this stage delivered, not just the one we used,
              // so the alternate branches don't get played later out of order.
              await supabase.from('ticket_scripts').update({ delivered: true })
                .eq('conversation_id', chatIdAtSend).eq('sequence', nextStage);
            }, 1800 + Math.random() * 1400);
          }

          // If this conversation is AI-driven, ask the bot for its next in-character
          // reply. The bot writes straight to Supabase, so it'll just show up like
          // any other message once it's done thinking.
          const isBotScenario = botScenarios.some(s => s.conversation_id === chatIdAtSend);
          if (isBotScenario) {
            fetch('/api/customer-bot', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'reply', conversationId: chatIdAtSend })
            }).catch(err => console.error('AI customer reply failed:', err));
          }
        }
      };

      const startNewGlobalChat = async () => {
        const namePrompt = prompt("Enter Customer Name for New Chat Scenario:", "Sarah Connor");
        if (!namePrompt) return;

        const newId = "chat_" + Date.now();
        const initialMessage = {
          conversation_id: newId,
          customer_name: namePrompt,
          text: `[New conversation opened for ${namePrompt}]`,
          sender: "System",
          role: "user",
          is_note: false
        };

        setActiveChatId(newId);
        await supabase.from('messages').insert([initialMessage]);
      };

      const addContactNote = async () => {
        if (!noteInput.trim()) return;
        const custName = currentActiveChat ? currentActiveChat.customerName : customerName;
        const newNote = {
          customer_name: custName,
          note: noteInput,
          author: agentName
        };
        setNoteInput("");
        const { error } = await supabase.from('contact_notes').insert([newNote]);
        if (error) {
          // Table probably doesn't exist yet in Supabase — surface it instead of failing silently
          alert("Couldn't save note. Has the contact_notes table been created in Supabase yet?\n\n" + error.message);
        }
      };

      // Free, no-AI-call way to make scripted customers feel a little more responsive:
      // bucket the trainee's reply into a rough category so we can pick from a few
      // pre-written branches instead of always playing the same fixed line.
      const classifyReply = (text) => {
        const t = text.toLowerCase();
        const questionHints = ['?', 'what is', 'what’s', "what's", 'where ', 'when ', 'how ', 'do you have', 'can you', 'could you', 'are you', 'is there', 'would you'];
        const solutionHints = ["i'll", "i will", "we can", "let me", "i recommend", "you should", "i'm going to", "im going to", "go ahead and", "we'll", "i can "];
        if (questionHints.some(h => t.includes(h))) return 'question';
        if (solutionHints.some(h => t.includes(h))) return 'solution';
        return 'default';
      };

      const fakeEmail = (name) => {
        if (!name) return "unknown@example.com";
        const slug = name.trim().toLowerCase().replace(/[^a-z\s]/g, "").split(/\s+/).filter(Boolean).join(".");
        return (slug || "customer") + "@example.com";
      };

      const initials = (name) => (name ? name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join("") : "?");

      const avatarPalette = ["bg-amber-500","bg-rose-500","bg-violet-500","bg-sky-500","bg-teal-500","bg-fuchsia-500"];
      const avatarColor = (name) => {
        if (!name) return avatarPalette[0];
        let h = 0;
        for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
        return avatarPalette[h % avatarPalette.length];
      };

      return (
        <div className="flex flex-col h-screen w-full bg-white text-[12px] select-none">

          {/* TRAINER CONSOLE STRIP — practice-mode controls, intentionally distinct from the Intercom UI below */}
          <div className="bg-[#0f1115] text-gray-300 px-4 py-1.5 flex flex-wrap gap-4 justify-between items-center text-[11px] shrink-0 border-b border-black/40">
            <div className="flex items-center gap-3">
              <span className="font-semibold text-gray-200 tracking-wide flex items-center gap-1.5">
                <i data-lucide="graduation-cap" className="w-3.5 h-3.5 text-blue-400"></i> TRAINER CONSOLE
              </span>
              <span className="text-gray-700">|</span>
              <div className="flex items-center gap-1.5">
                <span className="text-gray-500">Your display name:</span>
                <input
                  type="text"
                  value={agentName}
                  onChange={(e) => setAgentName(e.target.value)}
                  className="bg-[#1c1f26] text-blue-300 border border-gray-700 px-2 py-0.5 rounded text-[11px] w-32 outline-none focus:border-blue-400"
                />
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={startNewGlobalChat}
                className="bg-[#1c1f26] hover:bg-[#262a33] border border-gray-700 text-gray-200 px-3 py-1 rounded font-medium transition flex items-center gap-1">
                <i data-lucide="plus" className="w-3.5 h-3.5"></i> New scenario
              </button>

              <button
                onClick={startAIScenario}
                disabled={creatingAIScenario}
                title="Pulls a real closed ticket and has an AI play the customer"
                className="bg-violet-700 hover:bg-violet-600 disabled:opacity-50 disabled:cursor-wait text-white px-3 py-1 rounded font-medium transition flex items-center gap-1">
                <i data-lucide={creatingAIScenario ? "loader" : "sparkles"} className={`w-3.5 h-3.5 ${creatingAIScenario ? "animate-spin" : ""}`}></i>
                {creatingAIScenario ? "Pulling a ticket..." : "New AI scenario"}
              </button>

              <div className="flex items-center bg-[#1c1f26] border border-gray-700 rounded p-0.5">
                <button
                  onClick={() => setRole("Agent")}
                  className={`px-3 py-0.5 rounded font-medium transition flex items-center gap-1 ${role === "Agent" ? "bg-blue-600 text-white" : "text-gray-400 hover:text-gray-200"}`}>
                  <i data-lucide="headset" className="w-3 h-3"></i> Agent view
                </button>
                <button
                  onClick={() => setRole("Customer")}
                  className={`px-3 py-0.5 rounded font-medium transition flex items-center gap-1 ${role === "Customer" ? "bg-emerald-600 text-white" : "text-gray-400 hover:text-gray-200"}`}>
                  <i data-lucide="user" className="w-3 h-3"></i> Customer view
                </button>
              </div>
            </div>
          </div>

          <div className="flex flex-1 overflow-hidden">
            {/* 1. FAR LEFT ICON NAVIGATION */}
            <div className="w-[52px] bg-[#1a1c22] text-gray-400 flex flex-col items-center py-3 justify-between border-r border-black/40 shrink-0">
              <div className="flex flex-col items-center gap-1">
                <div className="w-7 h-7 mb-2 bg-gradient-to-br from-blue-500 to-blue-700 rounded-lg flex items-center justify-center font-bold text-white text-xs shadow">Z</div>
                <button className="p-2 hover:text-white rounded-lg hover:bg-white/5" title="Home"><i data-lucide="home" className="w-4 h-4"></i></button>
                <button className="p-2 text-white bg-[#2a2d35] rounded-lg" title="Inbox"><i data-lucide="inbox" className="w-4 h-4"></i></button>
                <button className="p-2 hover:text-white rounded-lg hover:bg-white/5" title="Tickets"><i data-lucide="ticket" className="w-4 h-4"></i></button>
                <button className="p-2 hover:text-white rounded-lg hover:bg-white/5" title="Reports"><i data-lucide="bar-chart-2" className="w-4 h-4"></i></button>
              </div>
              <div className="flex flex-col items-center gap-3">
                <button className="p-2 hover:text-white rounded-lg hover:bg-white/5" title="Settings"><i data-lucide="settings" className="w-4 h-4"></i></button>
                <div className={`w-6 h-6 rounded-full ${avatarColor(agentName)} text-white font-bold flex items-center justify-center text-[10px] ring-2 ring-[#1a1c22]`}>
                  {agentName ? agentName[0].toUpperCase() : "A"}
                </div>
              </div>
            </div>

            {/* 2. INBOX NAVIGATION TREE */}
            <div className="w-52 bg-[#f7f8fa] border-r border-gray-200 flex flex-col shrink-0">
              <div className="p-3 border-b border-gray-200 flex justify-between items-center bg-white">
                <span className="font-bold text-sm text-gray-900">Inboxes</span>
                <i data-lucide="plus" onClick={startNewGlobalChat} className="w-4 h-4 text-gray-500 cursor-pointer hover:text-black"></i>
              </div>
              <div className="p-2 border-b border-gray-200">
                <div className="flex items-center gap-2 bg-gray-100 px-2 py-1 rounded border border-gray-200">
                  <i data-lucide="search" className="w-3.5 h-3.5 text-gray-400"></i>
                  <input type="text" placeholder="Search conversations" className="bg-transparent text-xs outline-none w-full text-gray-700" />
                </div>
              </div>
              <div className="flex-1 overflow-y-auto p-2 space-y-0.5 text-gray-700">
                <div className="flex items-center justify-between px-2 py-1.5 rounded text-gray-500 cursor-pointer hover:bg-gray-200/60">
                  <div className="flex items-center gap-2"><i data-lucide="user-circle" className="w-3.5 h-3.5"></i><span>Your inbox</span></div>
                  <span className="text-[10px]">0</span>
                </div>
                <div className="flex items-center justify-between px-2 py-1.5 rounded text-gray-500 cursor-pointer hover:bg-gray-200/60">
                  <div className="flex items-center gap-2"><i data-lucide="at-sign" className="w-3.5 h-3.5"></i><span>Mentions</span></div>
                  <span className="text-[10px]">0</span>
                </div>
                <div className="flex items-center justify-between px-2 py-1.5 rounded bg-gray-200/80 font-bold text-gray-900 cursor-pointer">
                  <div className="flex items-center gap-2"><i data-lucide="users" className="w-3.5 h-3.5"></i><span>All conversations</span></div>
                  <span className="bg-gray-300/70 px-1.5 py-0.2 rounded-full text-[10px]">{conversationList.length}</span>
                </div>
                <div className="pt-3 pb-1 px-2 text-[10px] uppercase tracking-wider text-gray-400 font-bold">Teams</div>
                <div className="flex items-center justify-between px-2 py-1.5 rounded text-gray-500 cursor-pointer hover:bg-gray-200/60">
                  <div className="flex items-center gap-2"><i data-lucide="life-buoy" className="w-3.5 h-3.5"></i><span>Support</span></div>
                  <span className="text-[10px]">{conversationList.length}</span>
                </div>
              </div>
            </div>

            {/* 3. TICKET QUEUE PANEL */}
            <div className="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0">
              <div className="p-3 border-b border-gray-200 flex justify-between items-center bg-[#fafafa]">
                <span className="font-bold text-gray-900 text-sm">All conversations</span>
                <div className="flex items-center gap-1 text-[11px] text-gray-500 cursor-pointer">
                  <span>Waiting longest</span>
                  <i data-lucide="chevron-down" className="w-3 h-3"></i>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto divide-y divide-gray-100">
                {conversationList.map((chat) => (
                  <div
                    key={chat.id}
                    onClick={() => setActiveChatId(chat.id)}
                    className={`p-3 cursor-pointer transition flex gap-2.5 items-start ${activeChatId === chat.id ? "bg-blue-50/70 border-l-4 border-blue-600" : "hover:bg-gray-50 border-l-4 border-transparent"}`}>
                    <div className={`w-7 h-7 rounded-full ${avatarColor(chat.customerName)} text-white font-bold flex items-center justify-center text-[10px] shrink-0 mt-0.5`}>
                      {initials(chat.customerName)}
                    </div>
                    <div className="min-w-0 flex-1">
                      <div className="flex justify-between items-center mb-0.5">
                        <span className="font-bold text-gray-900 truncate max-w-[130px]">{chat.customerName}</span>
                        <span className="text-[9px] text-gray-400 shrink-0">{chat.time}</span>
                      </div>
                      <p className="text-gray-500 text-[11px] line-clamp-1">{chat.lastMsg}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* 4. MAIN CHAT & COMPOSER AREA */}
            <div className="flex-1 bg-white flex flex-col min-w-0">
              <div className="h-14 px-4 border-b border-gray-200 flex justify-between items-center bg-white shrink-0">
                <div className="flex items-center gap-2.5">
                  <div className={`w-7 h-7 rounded-full ${avatarColor(currentActiveChat?.customerName)} text-white font-bold flex items-center justify-center text-[11px] shrink-0`}>
                    {initials(currentActiveChat?.customerName)}
                  </div>
                  <div className="leading-tight">
                    <h2 className="font-bold text-sm text-gray-900">{currentActiveChat?.customerName || "Customer"}</h2>
                    <span className="text-[10px] text-gray-400">ZEVO Car Sharing · Practice scenario</span>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-full font-semibold flex items-center gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Open
                  </span>
                  <button className="p-1.5 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded"><i data-lucide="flag" className="w-3.5 h-3.5"></i></button>
                  <button className="p-1.5 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded"><i data-lucide="more-horizontal" className="w-4 h-4"></i></button>
                </div>
              </div>

              {/* Chat Thread */}
              <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-[#f9fafb]">
                {activeMessages.length === 0 && (
                  <div className="text-center text-gray-400 py-10">No messages in this chat yet. Type below to broadcast!</div>
                )}

                {activeMessages.map((m, idx) => (
                  <div key={idx} className="space-y-1">
                    {m.is_note ? (
                      <div className="bg-[#fffbeb] border border-[#fde68a] p-3 rounded-lg text-[#92400e] text-xs max-w-[85%] mx-auto shadow-2xs">
                        <div className="font-bold text-[10px] text-[#b45309] mb-0.5 flex items-center gap-1">
                          <i data-lucide="lock" className="w-3 h-3"></i> INTERNAL NOTE ({m.sender})
                        </div>
                        <div>{m.text}</div>
                      </div>
                    ) : m.role === "assistant" ? (
                      <div className="flex gap-2 max-w-[85%] items-start ml-auto flex-row-reverse">
                        <div className={`w-6 h-6 rounded-full ${avatarColor(m.sender)} text-white font-bold flex items-center justify-center text-[10px] shrink-0 mt-1`}>
                          {initials(m.sender)}
                        </div>
                        <div className="bg-white border border-gray-200 p-3 rounded-2xl rounded-tr-none text-gray-900 shadow-2xs leading-relaxed">
                          <div className="text-[10px] font-bold text-gray-500 mb-1 text-right">{m.sender}</div>
                          <div>{m.text}</div>
                        </div>
                      </div>
                    ) : (
                      <div className="flex gap-2 max-w-[85%] items-start">
                        <div className={`w-6 h-6 rounded-full ${avatarColor(m.sender)} text-white font-bold flex items-center justify-center text-[10px] shrink-0 mt-1`}>
                          {initials(m.sender)}
                        </div>
                        <div className="bg-white border border-gray-200 p-3 rounded-2xl rounded-tl-none text-gray-900 shadow-2xs leading-relaxed">
                          <div className="text-[10px] font-bold text-gray-500 mb-1">{m.sender}</div>
                          <div>{m.text}</div>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
                <div ref={chatEndRef} />
              </div>

              {/* Composer */}
              <div className="p-3 border-t border-gray-200 bg-white shrink-0">
                <div className="border border-gray-300 rounded-lg p-2.5 bg-white shadow-2xs focus-within:border-blue-400 transition">
                  {role === "Agent" && (
                    <div className="flex items-center gap-4 border-b border-gray-100 pb-2 mb-2 text-xs">
                      <button onClick={() => setActiveTab("Reply")} className={`font-bold flex items-center gap-1 ${activeTab === "Reply" ? "text-blue-600 border-b-2 border-blue-600 pb-1" : "text-gray-400"}`}>
                        <i data-lucide="corner-down-left" className="w-3 h-3"></i> Reply
                      </button>
                      <button onClick={() => setActiveTab("Note")} className={`font-bold flex items-center gap-1 ${activeTab === "Note" ? "text-amber-600 border-b-2 border-amber-600 pb-1" : "text-gray-400"}`}>
                        <i data-lucide="lock" className="w-3 h-3"></i> Note
                      </button>
                    </div>
                  )}
                  <textarea
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    onKeyDown={(e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
                    placeholder={role === "Customer" ? `Type as Customer (${currentActiveChat?.customerName})...` : (activeTab === "Note" ? "Write internal note for all agents..." : `Reply as ${agentName}...`)}
                    className="w-full text-xs outline-none resize-none min-h-[65px] text-gray-800"
                  />
                  <div className="flex justify-between items-center pt-2 border-t border-gray-100">
                    <div className="flex items-center gap-2.5 text-gray-400">
                      <i data-lucide="bold" className="w-3.5 h-3.5 cursor-pointer hover:text-gray-600"></i>
                      <i data-lucide="italic" className="w-3.5 h-3.5 cursor-pointer hover:text-gray-600"></i>
                      <i data-lucide="link" className="w-3.5 h-3.5 cursor-pointer hover:text-gray-600"></i>
                      <i data-lucide="paperclip" className="w-3.5 h-3.5 cursor-pointer hover:text-gray-600"></i>
                      <i data-lucide="smile" className="w-3.5 h-3.5 cursor-pointer hover:text-gray-600"></i>
                    </div>
                    <button onClick={sendMessage} className="bg-[#2563eb] text-white px-4 py-1.5 rounded font-semibold hover:bg-blue-700 flex items-center gap-1.5">
                      Send <i data-lucide="send" className="w-3 h-3"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {/* 5. RIGHT METADATA PANEL */}
            <div className="w-72 bg-[#fcfcfd] border-l border-gray-200 shrink-0 overflow-y-auto text-xs p-3 space-y-4">

              {/* Contact header */}
              <div className="flex flex-col items-center text-center pt-2 pb-1">
                <div className={`w-12 h-12 rounded-full ${avatarColor(currentActiveChat?.customerName)} text-white font-bold flex items-center justify-center text-base mb-2`}>
                  {initials(currentActiveChat?.customerName)}
                </div>
                <div className="font-bold text-gray-900 text-sm">{currentActiveChat?.customerName || "Customer"}</div>
                <div className="text-gray-400 text-[11px] flex items-center gap-1 mt-0.5">
                  <i data-lucide="mail" className="w-3 h-3"></i> {fakeEmail(currentActiveChat?.customerName)}
                </div>
                <button className="text-blue-600 hover:underline text-[11px] font-medium mt-1.5">View full profile</button>
              </div>

              <hr className="border-gray-200" />

              <div>
                <div className="flex justify-between items-center mb-1">
                  <span className="text-gray-400 text-[10px] uppercase font-bold tracking-wider">Assignee</span>
                </div>
                <div className="flex items-center gap-2 bg-white border border-gray-200 rounded-lg px-2 py-1.5">
                  <div className={`w-5 h-5 rounded-full ${avatarColor(agentName)} text-white font-bold flex items-center justify-center text-[9px]`}>
                    {agentName ? agentName[0].toUpperCase() : "A"}
                  </div>
                  <span className="font-medium text-gray-800 truncate">{agentName || "Unassigned"}</span>
                  <i data-lucide="chevron-down" className="w-3 h-3 text-gray-400 ml-auto"></i>
                </div>
              </div>

              <div>
                <div className="text-gray-400 text-[10px] uppercase font-bold tracking-wider mb-1.5">Team</div>
                <div className="flex items-center gap-2 bg-white border border-gray-200 rounded-lg px-2 py-1.5">
                  <i data-lucide="life-buoy" className="w-3.5 h-3.5 text-gray-400"></i>
                  <span className="font-medium text-gray-800">Support</span>
                </div>
              </div>

              <hr className="border-gray-200" />

              <div>
                <div className="text-gray-400 text-[10px] uppercase font-bold tracking-wider mb-1.5">Tags</div>
                <div className="flex flex-wrap gap-1.5">
                  <span className="bg-gray-100 border border-gray-200 text-gray-600 px-2 py-0.5 rounded-full text-[10px] flex items-center gap-1">
                    <i data-lucide="tag" className="w-2.5 h-2.5"></i> practice
                  </span>
                </div>
              </div>

              <hr className="border-gray-200" />

              <div>
                <div className="font-bold text-gray-800 mb-2 flex items-center gap-1.5">
                  <i data-lucide="building-2" className="w-3.5 h-3.5 text-gray-400"></i> User data
                </div>
                <div className="space-y-1.5 text-gray-600">
                  <div className="flex justify-between"><span className="text-gray-400">Company</span><span className="font-medium">ZEVO</span></div>
                  <div className="flex justify-between"><span className="text-gray-400">Status</span><span className="text-emerald-600 font-bold">Active rental</span></div>
                </div>
              </div>

              <hr className="border-gray-200" />

              {/* Contact notes — persisted per customer, shared across trainees via Supabase */}
              <div>
                <div className="font-bold text-gray-800 mb-2 flex items-center gap-1.5">
                  <i data-lucide="sticky-note" className="w-3.5 h-3.5 text-gray-400"></i> Notes
                </div>
                <div className="space-y-2 mb-2">
                  {customerNotes.length === 0 && (
                    <div className="text-gray-400 text-[11px] italic">No notes yet on this customer.</div>
                  )}
                  {customerNotes.map((n, idx) => (
                    <div key={idx} className="bg-[#fffbeb] border border-[#fde68a] rounded-lg p-2 text-[#78350f]">
                      <div className="text-gray-900">{n.note}</div>
                      <div className="text-[9px] text-[#b45309] font-semibold mt-1">
                        {n.author || "Agent"}{n.created_at ? " · " + new Date(n.created_at).toLocaleDateString([], { month: 'short', day: 'numeric' }) : ""}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="flex gap-1.5">
                  <input
                    type="text"
                    value={noteInput}
                    onChange={(e) => setNoteInput(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addContactNote(); } }}
                    placeholder="Add a note about this customer..."
                    className="flex-1 min-w-0 bg-white border border-gray-200 rounded px-2 py-1 text-[11px] outline-none focus:border-blue-400"
                  />
                  <button onClick={addContactNote} className="bg-gray-800 text-white px-2 rounded hover:bg-gray-900 shrink-0">
                    <i data-lucide="plus" className="w-3 h-3"></i>
                  </button>
                </div>
              </div>

              <hr className="border-gray-200" />

              <div>
                <div className="font-bold text-gray-800 mb-2">Previous conversations</div>
                <div className="text-gray-400 text-[11px] italic">None on record</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<IntercomApp />);
  </script>
</body>
</html>
