<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEVO Intercom Real-Time Training App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-[#f4f5f7] text-[#1a1a1a] h-screen overflow-hidden antialiased">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // YOUR SUPABASE CREDENTIALS
    const SUPABASE_URL = "https://ngqcidwtbnotylrrnqwm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_u7jNjlO1c7Z3AFvXzhwLMQ_LvLKjGip";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function IntercomApp() {
      const [role, setRole] = useState("Agent"); 
      const [customerName, setCustomerName] = useState("Tremaine Malden");
      const [agentName, setAgentName] = useState("John Batomalaque");
      
      const [activeTab, setActiveTab] = useState("Reply");
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState("");
      const chatEndRef = useRef(null);

      useEffect(() => {
        fetchMessages();

        const channel = supabase
          .channel('schema-db-changes')
          .on(
            'postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'messages' },
            (payload) => {
              setMessages((prev) => [...prev, payload.new]);
            }
          )
          .subscribe();

        return () => {
          supabase.removeChannel(channel);
        };
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const fetchMessages = async () => {
        const { data, error } = await supabase
          .from('messages')
          .select('*')
          .order('created_at', { ascending: true });
        if (!error && data) setMessages(data);
      };

      const sendMessage = async () => {
        if (!inputText.trim()) return;

        const newMessage = {
          text: inputText,
          sender: role === "Customer" ? customerName : agentName,
          role: role === "Customer" ? "user" : "assistant",
          is_note: role === "Agent" && activeTab === "Note"
        };

        setInputText("");
        await supabase.from('messages').insert([newMessage]);
      };

      return (
        <div className="flex flex-col h-screen w-full bg-white text-[12px] select-none">
          
          {/* TOP ROLE SWITCHER & NAME SETTINGS BAR */}
          <div className="bg-[#111827] text-white px-4 py-2 flex flex-wrap gap-4 justify-between items-center text-xs shrink-0 border-b border-gray-800">
            <div className="flex items-center gap-3">
              <span className="font-bold text-amber-400 flex items-center gap-1">⚡ INTERCOM SIMULATOR</span>
              <span className="text-gray-600">|</span>
              <div className="flex items-center gap-1.5">
                <span className="text-gray-400">Customer:</span>
                <input 
                  type="text" 
                  value={customerName} 
                  onChange={(e) => setCustomerName(e.target.value)} 
                  className="bg-gray-800 text-amber-300 border border-gray-700 px-2 py-0.5 rounded text-xs w-32 outline-none focus:border-amber-400"
                />
              </div>
              <div className="flex items-center gap-1.5">
                <span className="text-gray-400">Agent:</span>
                <input 
                  type="text" 
                  value={agentName} 
                  onChange={(e) => setAgentName(e.target.value)} 
                  className="bg-gray-800 text-blue-300 border border-gray-700 px-2 py-0.5 rounded text-xs w-32 outline-none focus:border-blue-400"
                />
              </div>
            </div>

            <div className="flex gap-2">
              <button 
                onClick={() => setRole("Agent")} 
                className={`px-3 py-1 rounded font-semibold transition ${role === "Agent" ? "bg-blue-600 text-white" : "bg-gray-800 text-gray-300 hover:bg-gray-700"}`}>
                🎧 Agent View ({agentName})
              </button>
              <button 
                onClick={() => setRole("Customer")} 
                className={`px-3 py-1 rounded font-semibold transition ${role === "Customer" ? "bg-emerald-600 text-white" : "bg-gray-800 text-gray-300 hover:bg-gray-700"}`}>
                👤 Customer View ({customerName})
              </button>
            </div>
          </div>

          <div className="flex flex-1 overflow-hidden">
            {/* 1. FAR LEFT ICON NAVIGATION */}
            <div className="w-[50px] bg-[#1d1d21] text-gray-400 flex flex-col items-center py-3 justify-between border-r border-gray-800 shrink-0">
              <div className="flex flex-col items-center gap-4">
                <div className="w-7 h-7 bg-white rounded-md flex items-center justify-center font-bold text-black text-xs shadow">i</div>
                <button className="p-2 text-white bg-[#2d2d32] rounded-lg"><i data-lucide="inbox" className="w-4 h-4"></i></button>
                <button className="p-2 hover:text-white"><i data-lucide="message-square" className="w-4 h-4"></i></button>
                <button className="p-2 hover:text-white"><i data-lucide="users" className="w-4 h-4"></i></button>
                <button className="p-2 hover:text-white"><i data-lucide="bar-chart-2" className="w-4 h-4"></i></button>
                <button className="p-2 hover:text-white"><i data-lucide="compass" className="w-4 h-4"></i></button>
              </div>
              <div className="flex flex-col items-center gap-3">
                <button className="p-2 hover:text-white"><i data-lucide="settings" className="w-4 h-4"></i></button>
                <div className="w-6 h-6 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-[10px]">
                  {agentName ? agentName[0].toUpperCase() : "A"}
                </div>
              </div>
            </div>

            {/* 2. INBOX NAVIGATION TREE */}
            <div className="w-56 bg-[#f8f9fa] border-r border-gray-200 flex flex-col shrink-0">
              <div className="p-3 border-b border-gray-200 flex justify-between items-center bg-white">
                <span className="font-bold text-sm text-gray-900">Inbox</span>
                <i data-lucide="plus" className="w-4 h-4 text-gray-500 cursor-pointer"></i>
              </div>
              <div className="p-2 border-b border-gray-200">
                <div className="flex items-center gap-2 bg-gray-100 px-2 py-1 rounded border border-gray-200">
                  <i data-lucide="search" className="w-3.5 h-3.5 text-gray-400"></i>
                  <input type="text" placeholder="Search" className="bg-transparent text-xs outline-none w-full text-gray-700" />
                </div>
              </div>
              <div className="flex-1 overflow-y-auto p-2 space-y-0.5 text-gray-700">
                <div className="flex items-center justify-between px-2 py-1.5 rounded hover:bg-gray-200 cursor-pointer">
                  <div className="flex items-center gap-2"><i data-lucide="user" className="w-3.5 h-3.5 text-gray-500"></i><span>Your Inbox</span></div>
                  <span className="text-gray-400 text-[10px]">0</span>
                </div>
                <div className="flex items-center justify-between px-2 py-1.5 rounded hover:bg-gray-200 cursor-pointer">
                  <div className="flex items-center gap-2"><i data-lucide="at-sign" className="w-3.5 h-3.5 text-gray-500"></i><span>Mentions</span></div>
                  <span className="text-gray-400 text-[10px]">0</span>
                </div>
                <div className="flex items-center justify-between px-2 py-1.5 rounded bg-gray-200/80 font-bold text-gray-900 cursor-pointer">
                  <div className="flex items-center gap-2"><i data-lucide="users" className="w-3.5 h-3.5"></i><span>All</span></div>
                  <span className="bg-gray-300/70 px-1.5 py-0.2 rounded-full text-[10px]">45</span>
                </div>

                <div className="pt-3 pb-1 px-2 font-bold text-[10px] text-gray-400 uppercase tracking-wider">Fin for Service</div>
                <div className="flex items-center justify-between px-2 py-1.5 rounded hover:bg-gray-200 cursor-pointer">
                  <span>All conversations</span>
                </div>
                <div className="flex items-center justify-between px-2 py-1.5 rounded hover:bg-gray-200 cursor-pointer">
                  <span>Resolved</span>
                </div>

                <div className="pt-3 pb-1 px-2 font-bold text-[10px] text-gray-400 uppercase tracking-wider">Team Inboxes</div>
                <div className="flex items-center justify-between px-2 py-1.5 rounded hover:bg-gray-200 cursor-pointer">
                  <div className="flex items-center gap-2"><i data-lucide="heart" className="w-3.5 h-3.5 text-red-500"></i><span>Support</span></div>
                  <span className="text-gray-400 text-[10px]">0</span>
                </div>
              </div>
            </div>

            {/* 3. TICKET QUEUE PANEL */}
            <div className="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0">
              <div className="p-3 border-b border-gray-200 flex justify-between items-center bg-[#fafafa]">
                <span className="font-bold text-gray-900 text-sm">All</span>
                <span className="text-[11px] text-gray-500">45 Open</span>
              </div>
              
              <div className="flex-1 overflow-y-auto divide-y divide-gray-100">
                {/* Active Ticket */}
                <div className="p-3 bg-blue-50/50 border-l-4 border-blue-600 cursor-pointer">
                  <div className="flex justify-between items-center mb-1">
                    <div className="flex items-center gap-1.5 font-bold text-gray-900">
                      <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                      <span>{customerName}</span>
                    </div>
                    <span className="text-[10px] text-gray-400">Live</span>
                  </div>
                  <p className="text-gray-600 text-[11px] line-clamp-2 leading-tight">
                    {messages.length > 0 ? messages[messages.length - 1].text : "No messages yet"}
                  </p>
                </div>

                {/* Dummy Queue Items for Realism */}
                <div className="p-3 hover:bg-gray-50 cursor-pointer opacity-70">
                  <div className="flex justify-between items-center mb-1">
                    <span className="font-semibold text-gray-800">Taylor White</span>
                    <span className="text-[10px] text-gray-400">14m</span>
                  </div>
                  <p className="text-gray-500 text-[11px] line-clamp-1">As we can see, the car is fully discharged at...</p>
                </div>
                <div className="p-3 hover:bg-gray-50 cursor-pointer opacity-70">
                  <div className="flex justify-between items-center mb-1">
                    <span className="font-semibold text-gray-800">Justin Cyril Tyler Jr</span>
                    <span className="text-[10px] text-gray-400">15m</span>
                  </div>
                  <p className="text-gray-500 text-[11px] line-clamp-1">John: Hi Justin- Thank you for contacting ZEVO...</p>
                </div>
              </div>
            </div>

            {/* 4. MAIN CHAT & COMPOSER AREA */}
            <div className="flex-1 bg-white flex flex-col min-w-0">
              {/* Header */}
              <div className="h-12 px-4 border-b border-gray-200 flex justify-between items-center bg-white shrink-0">
                <div className="flex items-center gap-2">
                  <h2 className="font-bold text-sm text-gray-900">{customerName}</h2>
                </div>
                <div className="flex items-center gap-2">
                  <button className="px-2.5 py-1 bg-gray-100 hover:bg-gray-200 rounded text-gray-700 font-medium flex items-center gap-1 text-[11px]">
                    <i data-lucide="phone" className="w-3 h-3"></i>
                  </button>
                  <button className="px-3 py-1 bg-black text-white rounded font-medium hover:bg-gray-800 flex items-center gap-1 text-[11px]">
                    <i data-lucide="check" className="w-3 h-3"></i> Close
                  </button>
                </div>
              </div>

              {/* Chat Messages */}
              <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-[#f9fafb]">
                {/* System Banner */}
                <div className="flex items-center justify-center gap-2 text-[11px] text-gray-500 my-2">
                  <span className="bg-white border border-gray-200 px-3 py-1 rounded-full shadow-2xs flex items-center gap-1">
                    🤖 Fin followed Guidance • Human agent request — Immediate
                  </span>
                </div>

                {messages.length === 0 && (
                  <div className="text-center text-gray-400 py-10">No messages yet. Send a message to start the simulation!</div>
                )}

                {messages.map((m, idx) => (
                  <div key={idx} className="space-y-1">
                    {m.is_note ? (
                      <div className="bg-[#fffbeb] border border-[#fde68a] p-3 rounded-lg text-[#92400e] text-xs max-w-[85%] mx-auto shadow-2xs">
                        <div className="font-bold text-[10px] text-[#b45309] mb-0.5 flex items-center gap-1">
                          <i data-lucide="lock" className="w-3 h-3"></i> INTERNAL NOTE ({m.sender})
                        </div>
                        <div>{m.text}</div>
                      </div>
                    ) : m.role === "assistant" ? (
                      <div className="max-w-[80%] bg-[#dbeafe] text-[#1e40af] p-3 rounded-2xl rounded-tr-none ml-auto border border-[#bfdbfe] shadow-2xs">
                        <div className="text-[10px] font-bold text-[#1d4ed8] mb-1">{m.sender || agentName}</div>
                        <div className="leading-relaxed text-gray-900">{m.text}</div>
                        <div className="text-[9px] text-[#3b82f6] text-right mt-1">Seen • Just now</div>
                      </div>
                    ) : (
                      <div className="flex gap-2 max-w-[85%] items-start">
                        <div className="w-6 h-6 rounded-full bg-amber-500 text-white font-bold flex items-center justify-center text-[10px] shrink-0 mt-1">
                          {m.sender ? m.sender[0].toUpperCase() : "C"}
                        </div>
                        <div className="bg-white border border-gray-200 p-3 rounded-2xl rounded-tl-none text-gray-900 shadow-2xs leading-relaxed">
                          <div className="text-[10px] font-bold text-gray-500 mb-1">{m.sender || customerName}</div>
                          <div>{m.text}</div>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
                <div ref={chatEndRef} />
              </div>

              {/* Composer */}
              <div className="p-3 border-t border-gray-200 bg-white shrink-0">
                <div className="border border-gray-300 rounded-lg p-2.5 bg-white shadow-2xs focus-within:border-blue-500">
                  {role === "Agent" && (
                    <div className="flex items-center gap-4 border-b border-gray-100 pb-2 mb-2 text-xs">
                      <button onClick={() => setActiveTab("Reply")} className={`font-bold flex items-center gap-1 ${activeTab === "Reply" ? "text-blue-600 border-b-2 border-blue-600 pb-1" : "text-gray-400"}`}>
                        <i data-lucide="corner-down-left" className="w-3 h-3"></i> Reply
                      </button>
                      <button onClick={() => setActiveTab("Note")} className={`font-bold flex items-center gap-1 ${activeTab === "Note" ? "text-amber-600 border-b-2 border-amber-600 pb-1" : "text-gray-400"}`}>
                        <i data-lucide="lock" className="w-3 h-3"></i> Note
                      </button>
                    </div>
                  )}
                  <textarea 
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    onKeyDown={(e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
                    placeholder={role === "Customer" ? `Type as ${customerName}...` : (activeTab === "Note" ? "Write private internal note..." : `Reply as ${agentName}...`)}
                    className="w-full text-xs outline-none resize-none min-h-[65px] text-gray-800"
                  />
                  <div className="flex justify-between items-center pt-2 border-t border-gray-100">
                    <div className="flex items-center gap-3 text-gray-400">
                      <i data-lucide="zap" className="w-4 h-4 cursor-pointer hover:text-gray-600"></i>
                      <i data-lucide="paperclip" className="w-4 h-4 cursor-pointer hover:text-gray-600"></i>
                      <i data-lucide="smile" className="w-4 h-4 cursor-pointer hover:text-gray-600"></i>
                    </div>
                    <button onClick={sendMessage} className="bg-[#2563eb] text-white px-4 py-1 rounded font-semibold hover:bg-blue-700">
                      Send
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {/* 5. RIGHT METADATA ACCORDIONS */}
            <div className="w-64 bg-[#fcfcfd] border-l border-gray-200 shrink-0 overflow-y-auto text-xs">
              <div className="flex border-b border-gray-200 bg-white">
                <button className="flex-1 py-2 font-bold border-b-2 border-black text-gray-900 text-center">Details</button>
                <button className="flex-1 py-2 font-medium text-gray-400 text-center hover:text-gray-600">Copilot</button>
              </div>

              <div className="p-3 space-y-4">
                <div>
                  <div className="text-gray-400 text-[10px] uppercase font-bold tracking-wider mb-1.5">Assignee</div>
                  <div className="flex items-center gap-2 font-semibold text-gray-800">
                    <div className="w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center text-[9px] font-bold">
                      {agentName ? agentName[0].toUpperCase() : "A"}
                    </div>
                    <span className="truncate">{agentName}</span>
                  </div>
                </div>

                <hr className="border-gray-200" />

                <div>
                  <div className="flex justify-between items-center font-bold text-gray-800 mb-2">
                    <span>Links</span>
                    <i data-lucide="chevron-down" className="w-3.5 h-3.5 text-gray-400"></i>
                  </div>
                  <div className="space-y-1.5 text-gray-600">
                    <div className="flex justify-between"><span className="text-gray-400">Tracker ticket</span><span className="text-blue-600">+</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">Back-office tickets</span><span className="text-blue-600">+</span></div>
                  </div>
                </div>

                <hr className="border-gray-200" />

                <div>
                  <div className="flex justify-between items-center font-bold text-gray-800 mb-2">
                    <span>Conversation attributes</span>
                    <i data-lucide="chevron-down" className="w-3.5 h-3.5 text-gray-400"></i>
                  </div>
                  <div className="space-y-2 text-gray-600">
                    <div className="flex justify-between"><span className="text-gray-400">AI Title</span><span className="font-medium">Extension request</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">ID</span><span className="font-mono text-[10px]">215475238935988</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">Company</span><span className="font-medium">ZEVO</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">Brand</span><span className="font-medium">ZEVO</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">Urgency</span><span className="text-blue-600 cursor-pointer">Select</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">Issue Type</span><span className="text-blue-600 cursor-pointer">Select</span></div>
                  </div>
                </div>

                <hr className="border-gray-200" />

                <div>
                  <div className="flex justify-between items-center font-bold text-gray-800 mb-2">
                    <span>User data</span>
                    <i data-lucide="chevron-down" className="w-3.5 h-3.5 text-gray-400"></i>
                  </div>
                  <div className="space-y-2 text-gray-600">
                    <div className="flex justify-between"><span className="text-gray-400">Name</span><span className="font-medium truncate max-w-[110px]">{customerName}</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">Company</span><span className="font-medium">ZEVO</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">Location</span><span>Dallas, TX, US</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">Email</span><span className="text-blue-600 truncate max-w-[110px]">tremainemalden@gmail.com</span></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<IntercomApp />);
  </script>
</body>
</html>
